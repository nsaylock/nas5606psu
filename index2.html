<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home</title>
    <link rel="stylesheet" href="style-home.css">
</head>
<body>
  <h1>nicksaylock.com</h1>
  <div id="bgIMG"></div>
  <div id="bgOverlay"></div>
  <div class="carousel">
    <div id="career">
      <button id="career-button">Career</button>
      <div class="career-outline"></div>
    </div>
    <div id="program">
      <button id="program-button">Computer<br>Programming</button>
      <div class="program-outline"></div>
    </div>
    <div id="music">
      <button id="music-button">Music<br>Production</button>
      <div class="music-outline"></div>
    </div>

    <button id="left">
      <img class="left-arrow" src="img-home/increase.png">
    </button>
    <button id="right">
      <img class="right-arrow" src="img-home/increase.png">
    </button>


  </div>
</body>

<script>
  const bgIMG = document.getElementById('bgIMG');
  const bgOverlay = document.getElementById('bgOverlay');
  const career = document.getElementById('career');
  const careerButton = document.getElementById('career-button');
  const program = document.getElementById('program');
  const programButton = document.getElementById('program-button');
  const music = document.getElementById('music');
  const musicButton = document.getElementById('music-button');
  const left = document.getElementById('left');
  const right = document.getElementById('right');

  const time = 1000;
  const totalFrames = time/100*6;
  const edgeMax = 350;
  let circle = {
    left: program,
    leftButton: programButton,
    leftName: 'program',
    center: career,
    centerButton: careerButton,
    centerName: 'career',
    right: music,
    rightButton: musicButton,
    rightName: 'music'
  }

  let mult = 1;
  let sw = 0;
  let swTotal = 350;
  let prevSW = 0;
  let allow = true;
  let arrowsGone = false;
  document.addEventListener('wheel', (e) => {
    e.preventDefault();
    if (allow) {
      if (e.wheelDelta < 0) {
        cycle_right();
      } else {
        cycle_left();
      }
    }
    if (arrowsGone == false) dissolve_arrows();
  }, {passive: false}
);

function dissolve_arrows() {
  left.animate([
    { opacity: '100%' },
    { opacity: '0%' }
  ], { 
    duration: 500,
    fill: 'forwards'
  });
  right.animate([
    { opacity: '100%' },
    { opacity: '0%' }
  ], { 
    duration: 500,
    fill: 'forwards'
  });
  arrowsGone = true;
}
  
    let xL = -250;
    let yL = -25;
    let Lscale = 0.75;
    let shrinkScale = 1;
    let growScale = 0.75;
    let xC = 0;
    let yC = 0;
    let xR = 250;
    let yR = -25;


  // Control Animation Speed
  

  left.addEventListener('click', ()=> { if (allow) cycle_left() });
  right.addEventListener('click', ()=> { if (allow) cycle_right() });

  function delay(ms) {
    return new Promise(resolve => setTimeout(resolve, ms));
  }

  async function cycle_left() {
    direction_flip('left');
    cycle_animation('left');
    await delay(time);
    switch_circles();
  }

  async function cycle_right() {
    direction_flip('right');
    cycle_animation('right');
    await delay(time);
    switch_circles();
  }

  let flipKey = 'right';
  let flip = false;
  function direction_flip(direction) {
    if (flipKey == direction) {
      flip = true;
      if (direction == 'right') flipKey = 'left';
      else flipKey = 'right';
    }
    if (flip == true) {
      tempLeft = circle.left;
      tempLB = circle.leftButton;
      tempLN = circle.leftName;
      tempRight = circle.right;
      tempRB = circle.rightButton;
      tempRN = circle.rightName;
      circle.left = tempRight;
      circle.right = tempLeft;
      circle.leftButton = tempRB;
      circle.leftName = tempRN;
      circle.rightButton = tempLB;
      circle.rightName = tempLN;
      flip = false;
    }
    
  }

  async function switch_circles() {
    allow = true;
    tempLeft = circle.left;
    tempLB = circle.leftButton;
    tempLN = circle.leftName;
    tempRight = circle.right;
    tempRB = circle.rightButton;
    tempRN = circle.rightName;
    tempCenter = circle.center;
    tempCB = circle.centerButton;
    tempCN = circle.centerName;

    circle.left = tempCenter;
    circle.leftButton = tempCB;
    circle.leftName = tempCN;
    circle.center = tempRight;
    circle.centerButton = tempRB;
    circle.centerName = tempRN;
    circle.right = tempLeft;
    circle.rightButton = tempLB;
    circle.rightName = tempLN;
    cancelAnimationFrame(bgStepId);
    background_animation(circle.centerName);
    fade_in();
  }

  function fade_out() {
    bgOverlay.animate([
      { backgroundColor: 'rgba(0,0,0,0)'},
      { backgroundColor: 'rgba(0,0,0,1)'},
    ],
    {duration: time,
      fill: 'forwards'
    }
  );
  }

  function fade_in() {
    bgOverlay.animate([
      { backgroundColor: 'rgba(0,0,0,1)'},
      { backgroundColor: 'rgba(0,0,0,0)'},
    ],
    {duration: time,
      fill: 'forwards'
    }
  );
  }

  function background_animation(front) {
    if (front == 'career') imgURL = "url('img-home/Degrees.jpg')";
    else if (front == 'program') imgURL = "url('img-home/new_index_code.png')";
    else if (front == 'music') imgURL = "url('img-home/IMG_4093.JPG')";
    bgIMG.style.backgroundImage = imgURL;
    let bgTime = 50000;
    let start = null;
    function bgStep(timestamp) {
      if (start == undefined) start = timestamp;
      const elapsed = timestamp - start;
      if (elapsed < bgTime) {
        scale = elapsed / bgTime * 0.25;
        pos = elapsed / bgTime * 30;
        bgIMG.style.transform = `scale(${1-scale}) translate(${-50 + pos}%, ${-50 + pos}%)`;
        requestAnimationFrame(bgStep);
      }
    }
    bgStepId = requestAnimationFrame(bgStep);
  }

  background_animation('career');

  function reset_parameters() {
    xL = -250 * mult;
    yL = -25;
    Lscale = 0.75;
    shrinkScale = 1;
    growScale = 0.75;
    xC = 0;
    yC = 0;
    xR = 250 * mult;
    yR = -25;
  }

  const RTA = totalFrames/7;
  const LTA = totalFrames - totalFrames/7;

  function cycle_animation(direction) {
    fade_out();

    allow = false;
    if (direction == 'left') mult = 1;
    else mult = -1;
    let start = null;
    reset_parameters();
    let frame = 1;
    function step(timestamp) {
      if (start == undefined) start = timestamp;
      const elapsed = timestamp - start;
      if (elapsed <= time) {
        
        // Left slides acros back to right position
        xL += 500/totalFrames * mult;
        
        if (frame < totalFrames/2) {
          Lscale -= 0.125/totalFrames;
          yL -= 50/totalFrames;
        } else {
          Lscale += 0.125/totalFrames;
          yL += 50/totalFrames;
        }
        circle.left.style.transform = `scale(${Lscale}) translate(${xL}px, ${yL}px)`;


        // Center slides to left position and shrinks
        
        shrinkScale -= 0.25/totalFrames;

        yC -= 25/totalFrames;
        if (frame <= LTA) {
          xC -= edgeMax/totalFrames * mult;
        } else {
          xC += edgeMax/totalFrames * mult;
          circle.center.style.zIndex = 1;
        }
        circle.center.style.transform = `scale(${shrinkScale}) translate(${xC}px, ${yC}px)`;


        // Right slides to center position and grows
        
        growScale += 0.25/totalFrames;
        yR += 25/totalFrames;
        if (frame <= RTA+1) {
          xR += edgeMax/totalFrames * mult;
        } else {
          xR -= edgeMax/totalFrames * mult;
          circle.right.style.zIndex = 3;
        }
        circle.right.style.transform = `scale(${growScale}) translate(${xR}px, ${yR}px)`;

        // Shadow
        shadow = frame/totalFrames*10*mult;
        circle.centerButton.style.boxShadow = `inset ${shadow}px 0 35px 25px black`;
        circle.leftButton.style.boxShadow = `inset ${10 - shadow}px ${shadow}px 35px 25px black`;
        circle.rightButton.style.boxShadow = `inset 0 ${10 - shadow}px 35px 25px black`;


        requestAnimationFrame(step);
        frame++;
      }
    }
    requestAnimationFrame(step);
  }




</script>

</html>
