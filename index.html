<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nick Saylock</title>
    <link rel="stylesheet" href="reset.css">
    <link rel="stylesheet" href="style-home.css">
</head>
<body>
  <div id="bgIMG"></div>
  <div id="bgOverlay"></div>
  <div class="carousel">
    <div class="career-container">
      <div id="career">
        <a href="divisions/career/resume.html">
          <button id="career-button">Career</button>
        </a> 
        <div class="career-outline"></div>
      </div>
      <div id="shadow-career"></div>
    </div>
    
    <div class="program-container">
      <div id="program">
        <a href="divisions/programming/programming-home.html">
          <button id="program-button">Computer<br>Programming</button>
        </a>
        <div class="program-outline"></div>
      </div>
      <div id="shadow-program"></div>
    </div>
    
    <div class="music-container">
      <div id="music">
        <a href="divisions/music/music-home.html">
          <button id="music-button">Music<br>Production</button>
        </a>
        <div class="music-outline"></div>
      </div>
      <div id="shadow-music"></div>
    </div>
    


  </div>
  <script>

    document.body.style.display = 'none';
    void document.body.offsetHeight; // force reflow
    document.body.style.display = 'flex';

  const bgIMG = document.getElementById('bgIMG');
  const bgOverlay = document.getElementById('bgOverlay');
  const career = document.getElementById('career');
  const careerButton = document.getElementById('career-button');
  const program = document.getElementById('program');
  const programButton = document.getElementById('program-button');
  const music = document.getElementById('music');
  const musicButton = document.getElementById('music-button');
  const left = document.getElementById('left');
  const right = document.getElementById('right');

  const time = 1000;
  const totalFrames = time/100*6;
  const edgeMax = 350;
  let fadeInProgess;
  let shadowAnimationId;
  let fadeInAnimationId;
  let fadeOutAnimationId;

  
  const shadowCareer = {
    id: document.getElementById('shadow-career'),
    initialWidth: 30, // percent
    initialHeight: 20, //percent
    initialOpacity: 1,
    initialFeather: 20, //percent
    width: 30, // percent
    height: 20, //percent
    opacity: 1,
    feather: 20 //percent
  }
  

  const shadowProgram = {
    id: document.getElementById('shadow-program'),
    initialWidth: 30, // percent
    initialHeight: 20, //percent
    initialOpacity: 1,
    initialFeather: 20, //percent
    width: 30, // percent
    height: 20, //percent
    opacity: 1,
    feather: 20 //percent
  }
  const shadowMusic = document.getElementById('shadow-music');

  let progress = 0;

  careerButton.addEventListener('mouseenter', ()=>{
    _mouseEnterFunctionChain('career', shadowCareer);
  });

  careerButton.addEventListener('mouseleave', ()=>{
    _mouseLeaveFunctionChain(shadowCareer);
  });

  programButton.addEventListener('mouseenter', ()=>{
    _mouseEnterFunctionChain('program', shadowProgram);
  });

  programButton.addEventListener('mouseleave', ()=>{
    _mouseLeaveFunctionChain(shadowProgram);
  });

  musicButton.addEventListener('mouseenter', ()=>{
    _mouseEnterFunctionChain('music', shadowMusic);
  });

  musicButton.addEventListener('mouseleave', ()=>{
    _mouseLeaveFunctionChain(shadowMusic);
  });

function _mouseEnterFunctionChain(strId, shadowId) {
  if (fadeOutAnimationId != undefined) {
    cancelAnimationFrame(fadeOutAnimationId);
  }
  background_animation(strId);
  _growShadow(shadowId);
}

function _mouseLeaveFunctionChain(shadowId) {
  cancelAnimationFrame(shadowAnimationId);
  cancelAnimationFrame(fadeInAnimationId);
  fade_out();
  let rTime = 1000 * progress;
  _shrinkShadow(shadowId, rTime);
}
  
function _growShadow(element) {
  let eTime = 1000;
  let start = null;
  function step(timestamp) {
    if (start == undefined) start = timestamp;
    const elapsed = timestamp - start;
    if (elapsed < eTime) {
      progress = elapsed / eTime;
      easedProgress = easeOutQuad(Math.min(progress, 1));
      element.width = element.initialWidth + 20 * easedProgress;
      element.height = element.initialHeight + 10 * easedProgress;
      element.opacity = element.initialOpacity - 0.5 * easedProgress;
      element.feather = element.initialFeather - 10 * easedProgress;
      element.id.style.background = 
      `radial-gradient(${element.width}% ${element.height}%, 
      rgba(0, 0, 0, ${element.opacity}) ${element.feather}%, rgba(0, 0, 0, 0))`;
      // rgb(201, 157, 15)
    }
    if (progress < 1) {
      shadowAnimationId = requestAnimationFrame(step);
    }
  }
  shadowAnimationId = requestAnimationFrame(step);
}

function _shrinkShadow(element, rTime) {
  let rProgress;
  let easedProgress;
  let start = null;
  let rHeight = element.height - element.initialHeight;
  let rWidth = element.width - element.initialWidth;
  let rOpacity = element.initialOpacity - element.opacity;
  let rFeather = element.initialFeather - element.feather;
  function step(timestamp) {
    if (start == undefined) start = timestamp;
    const elapsed = timestamp - start;
    if (elapsed < rTime) {
      rProgress = elapsed / rTime;
      easedProgress = easeOutQuad(Math.min(rProgress, 1));
      
      element.id.style.background = 
      `radial-gradient(${element.width - rWidth*easedProgress}% ${element.height - rHeight*easedProgress}%, 
      rgba(0, 0, 0, ${element.opacity + rOpacity*easedProgress}) ${element.feather + rFeather*easedProgress}%, rgba(0, 0, 0, 0))`;
      // rgb(201, 157, 15)
    }
    if (progress < 1) {
      shrinkAnimationId = requestAnimationFrame(step);
    }
  }
  shrinkAnimationId = requestAnimationFrame(step);
}
  
function easeOutQuad(k) {
  return 1 - (1 - k) * (1 - k);
}


  function delay(ms) {
    return new Promise(resolve => setTimeout(resolve, ms));
  }


  function fade_in() {
    bgIMG.style.backgroundImage = 'none';
    let start = null;
    let fadeInTime = 1500;
    let percent;
    function step(timestamp) {
      if (!start) start = timestamp;
      const elapsed = timestamp - start;
      if (elapsed < fadeInTime) {
        percent = elapsed / fadeInTime;
        fadeInProgess = percent;
        bgOverlay.style.background = `radial-gradient(rgba(35, 112,
        199, ${1 - 1*percent}), rgba(0, 0, 0, ${1 - 1*percent}))`;
        fadeInAnimationId = requestAnimationFrame(step);
      }
    }
    fadeInAnimationId = requestAnimationFrame(step);
  }

 let bgStepId = null;
let bgFadeTimeoutId = null;

function background_animation(front) {
  cancelAnimationFrame(bgStepId);
  clearTimeout(bgFadeTimeoutId);

  let imgURL;
  if (front === 'career') {
    imgURL = "url('img-home/Degrees.jpg')";
  } else if (front === 'program') {
    imgURL = "url('img-home/new_index_code.png')";
  } else if (front === 'music') {
    imgURL = "url('img-home/temp_MP.JPG')";
  }

  fade_in();
  bgIMG.style.backgroundImage = imgURL;

  const bgTime = 50000;
  let start = null;

  function bgStep(timestamp) {
    if (start === null) start = timestamp;
    const elapsed = timestamp - start;
    if (elapsed < bgTime) {
      const scale = (elapsed / bgTime) * 0.25;
      const pos = (elapsed / bgTime) * 30;
      bgIMG.style.transform = `scale(${1 - scale}) translate(${-50 + pos}%, ${-50 + pos}%)`;
      bgStepId = requestAnimationFrame(bgStep);
    }
  }
  bgStepId = requestAnimationFrame(bgStep);
}

function fade_out() {
  let start = null;
    let percent;
    let duration = 1000 * fadeInProgess;
    let startOpacity = 1 - fadeInProgess;
    function step(timestamp) {
      if (!start) start = timestamp;
      const elapsed = timestamp - start;
      if (elapsed < duration) {
        percent = elapsed / duration;
        bgOverlay.style.background = `radial-gradient(rgba(35, 112,
        199, ${startOpacity + percent}), rgba(0, 0, 0, ${startOpacity + percent}))`;
        fadeOutAnimationId = requestAnimationFrame(step);
      }
    }
    fadeOutAnimationId = requestAnimationFrame(step);

    
}

</script>
</body>



</html>
