<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NS — music player</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app">

  <!-- LEFT: LIBRARY -->
  <aside class="library">
    <div class="library__brand">
      <span class="brand__mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none">
          <circle cx="12" cy="12" r="9.25" stroke="currentColor" stroke-width="1.5"/>
          <circle cx="12" cy="12" r="3" fill="currentColor"/>
        </svg>
      </span>
      <span class="brand__name">NSPlayer</span>
    </div>

    <div class="library__search">
      <input type="text" id="searchInput" placeholder="Find an artist, album, or song" autocomplete="off">
    </div>

    <div class="library__scroll" id="libraryList" role="tree" aria-label="Artist and album library"></div>
  </aside>

  <!-- CENTER: MAIN VIEW -->
  <main class="view" id="view">
    <section class="view__header" id="viewHeader">
      <div class="empty-state">
        <p class="empty-state__eyebrow">Nothing queued up</p>
        <h2>Pick an album from the library</h2>
        <p class="empty-state__sub">Your artists and albums are listed on the left. Select one to see its tracks here.</p>
      </div>
    </section>
    <section class="view__tracklist" id="trackList"></section>
  </main>

  <!-- BOTTOM: TRANSPORT -->
  <footer class="transport">

    <div class="transport__now" id="nowPlayingBlock">
      <div class="np-art" id="npArt" aria-hidden="true"></div>
      <div class="np-meta">
        <div class="np-title" id="npTitle">Nothing playing</div>
        <div class="np-sub" id="npSub">Select a track to begin</div>
      </div>
    </div>

    <div class="transport__center">
      <div class="transport__buttons">
        <button class="tbtn tbtn--ghost" id="prevBtn" aria-label="Previous track" disabled>
          <svg viewBox="0 0 24 24" width="24" height="24"><path d="M6 5h2v14H6zM19 5.5L9 12l10 6.5z" fill="currentColor"/></svg>
        </button>

        <button class="tbtn tbtn--play" id="playBtn" aria-label="Play" disabled>
          <svg id="playIcon" viewBox="0 0 24 24" width="24" height="24"><path d="M8 5.5v13l11-6.5z" fill="currentColor"/></svg>
          <svg id="pauseIcon" viewBox="0 0 24 24" width="24" height="24" style="display:none"><path d="M7 5h4v14H7zM13 5h4v14h-4z" fill="currentColor"/></svg>
        </button>

        <button class="tbtn tbtn--ghost" id="nextBtn" aria-label="Next track" disabled>
          <svg viewBox="0 0 24 24" width="24" height="24"><path d="M16 5h2v14h-2zM5 5.5L15 12 5 18.5z" fill="currentColor"/></svg>
        </button>
      </div>

      <div class="transport__scrub">
        <span class="mono time" id="curTime">0:00</span>
        <input type="range" id="seek" class="seek" min="0" max="1000" value="0" step="1" disabled aria-label="Seek">
        <span class="mono time" id="durTime">0:00</span>
      </div>
    </div>

    <div class="transport__right">
      <span class="mono track-index" id="trackIndex">— / —</span>
      <button class="vol-btn" id="muteBtn" aria-label="Mute">
        <svg id="volIconOn" viewBox="0 0 24 24" width="17" height="17"><path d="M4 9v6h4l5 4V5L8 9H4z" fill="currentColor"/><path d="M17 8.5a5 5 0 010 7" stroke="currentColor" stroke-width="1.6" fill="none" stroke-linecap="round"/></svg>
        <svg id="volIconOff" viewBox="0 0 24 24" width="17" height="17" style="display:none"><path d="M4 9v6h4l5 4V5L8 9H4z" fill="currentColor"/><path d="M16.5 9.5l4 4m0-4l-4 4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
      </button>
      <input type="range" id="volume" class="seek seek--volume" min="0" max="100" value="80" aria-label="Volume">
    </div>

  </footer>
</div>

<audio id="audio" preload="metadata"></audio>

<script src="library.js"></script>
<script src="script.js"></script>
</body>
</html>
