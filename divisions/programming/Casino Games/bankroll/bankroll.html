<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>bankroll</title>
    <link rel="stylesheet" href="bankroll.css">
    <script src="bankroll.js" defer></script>
</head>
<body class="no-scroll">
  <div id="staged-bet-chips"></div>
  <div class="mouse-location-container hidden">
      <p>Mouse X:</p><div id="mouse-x"></div>
      <p>Mouse Y:</p><div id="mouse-y"></div>
      <p>Chips X:</p><div id="chips-x"></div>
      <p>Chips Y:</p><div id="chips-y"></div>
      <p>DifferenceX:</p><div id="difference-x"></div>
      <p>DifferenceY:</p><div id="difference-y"></div>
    </div>

  <div id="bottom-container">
    <div class="bet-container">
      <div id="bet-control-buttons">
        
        <div class="control-column">
          <button id="increment1">
            <img src="../img/increase.png" class="arrow" >
          </button>
          <div class="control-label">1</div>
          <button id="decrement1">
            <img src="../img/decrease.png" class="arrow">
          </button>
        </div>

        <div class="control-column">
          <button id="increment5">
            <img src="../img/increase.png" class="arrow" >
          </button>
          <div class="control-label">5</div>
          <button id="decrement5">
            <img src="../img/decrease.png" class="arrow">
          </button>
        </div>

        <div class="control-column">
          <button id="increment25">
            <img src="../img/increase.png" class="arrow" >
          </button>
          <div class="control-label">25</div>
          <button id="decrement25">
            <img src="../img/decrease.png" class="arrow">
          </button>
        </div>

        <div class="control-column">
          <button id="increment100">
            <img src="../img/increase.png" class="arrow" >
          </button>
          <div class="control-label">100</div>
          <button id="decrement100">
            <img src="../img/decrease.png" class="arrow">
          </button>
        </div>

        <div class="control-column">
          <button id="increment500">
            <img src="../img/increase.png" class="arrow" >
          </button>
          <div class="control-label">500</div>
          <button id="decrement500">
            <img src="../img/decrease.png" class="arrow">
          </button>
        </div>

        <div id="high-roller" class="hidden">
          <button id="increment5000">
            <img src="../img/increase.png" class="arrow" >
          </button>
          <div class="control-label" style="margin: 1px 0 3px 0;">5k</div>
          <button id="decrement5000">
            <img src="../img/decrease.png" class="arrow">
          </button>
        </div>

        <div class="control-column">
          <button id="clear-bet">Clear</button>
          <button id="pull-back-button">Pull</button>
        </div>
      </div>
      <div id="staged-bet-container">
        <div id="staged-bet"></div>
      </div>
      </div> <!-- Close Bet Container -->

      <div class="bankroll-container">
        <div class="bankroll-label-on-table">B A N K  R O L L</div>
        <div id="bankroll-chips"></div>
        <div id="bankroll-collection-target"></div>
        <div id="round-up"></div>
      </div>
    </div> <!-- Close Bottom Container -->

    <button id="show-money-button">
      <img src="../img/double_arrow.png" id="double-arrow" class="open">
    </button>
    <div id="money-container" class="open">
      <div class="bankroll-label">Bankroll
        <div id="bankroll-amount">$500</div>
      </div>
      <div class = 'money-label'>Money On Table
        <div id="money-on-table">$0</div>
      </div>
    </div> <!-- Close Money Container -->
</body>
</html>
