<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blackjack</title>
    <link rel="stylesheet" href="../bankroll/bankroll.css">
    
    <link rel="stylesheet" href="blackjack.css">
    <script src="../bankroll/bankroll.js" defer></script>
    <script src="blackjack.js" defer></script>
</head>
<body class="no-scroll">
  <div class="main-container">

    <div id="debug-box">BJ V1</div>

    <div class="main">
      <div id="message-box"></div>
      <div class="label">
        <div class="name">Dealer</div>
        <div id="dealer-total"></div>
      </div>
      <div id="dealer-hand"></div>
      <div id="current-hand-indicator-container"></div>
      <div id="player-hand-container">
        <div id="player-hand"></div>
      </div>
      <div id="split-chips-container"></div>

      <div class="controls">
        <button id="deal-button" class="control-button">Deal</button>
        <button id="hit-button" class="control-button">Hit</button>
        <button id="stay-button" class="control-button">Stay</button>
        <button id="double-down-button" class="control-button">Double<br>Down</button>
      </div>
        <button id="split-button" class="control-button hidden">Split</button>
      <div class="label" style="margin-top: 20px;">
        <div class="name">Player</div>
        <div id="player-total"></div>
      </div>

      <div class="main-bet">
        <div id="main-bet-chips"></div>
        <button id="main-bet-button"></button>
        <div id="main-bet-amount"></div>
      </div>
    </div> <!-- Close main -->

    <!-- Bankroll UI -->
     <div id="staged-bet-chips"></div>

  <div id="bottom-container">
    <div class="bet-container">
      <div id="bet-control-buttons">
        
        <div class="control-column">
          <button id="increment1">+</button>
          <div class="control-label">1</div>
          <button id="decrement1">-</button>
        </div>

        <div class="control-column">
          <button id="increment5">+</button>
          <div class="control-label">5</div>
          <button id="decrement5">-</button>
        </div>

        <div class="control-column">
          <button id="increment25">+</button>
          <div class="control-label">25</div>
          <button id="decrement25">-</button>
        </div>

        <div class="control-column">
          <button id="increment100">+</button>
          <div class="control-label">100</div>
          <button id="decrement100">+</button>
        </div>

        <div class="control-column">
          <button id="increment500">+</button>
          <div class="control-label">500</div>
          <button id="decrement500">-</button>
        </div>

        <div id="high-roller" class="hidden">
          <button id="increment5000">+</button>
          <div class="control-label" style="margin: 1px 0 3px 0;">5k</div>
          <button id="decrement5000">-</button>
        </div>

        <div class="control-column">
          <button id="clear-bet">Clear</button>
          <button id="pull-back-button">Pull</button>
        </div>
      </div>
      <div id="staged-bet-container" class="hidden">
        <div id="staged-bet" class="hidden"></div>
      </div>
      </div> <!-- Close Bet Container -->

      <div class="bankroll-container">
        <div class="bankroll-label-on-table">B A N K  R O L L</div>
        <div id="bankroll-chips"></div>
        <div id="bankroll-collection-target"></div>
        <div id="round-up"></div>
      </div>
    </div> <!-- Close Bottom Container -->

    <button id="show-money-button">
      <img src="../img/double_arrow.png" id="double-arrow" class="open">
    </button>
    <div id="money-container" class="open">
      <div class="bankroll-label">Bankroll
        <div id="bankroll-amount">$500</div>
      </div>
      <div class = 'money-label'>Money On Table
        <div id="money-on-table">$0</div>
      </div>
    </div> <!-- Close Money Container -->

  </div> <!-- Close main-container -->
</body>
</html>
